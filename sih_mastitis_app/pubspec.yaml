name: sih_mastitis_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^18.0.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  http: ^1.6.0
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - lib/localization/en.json
    - lib/localization/ta.json
    - lib/localization/hi.json
    - lib/localization/ml.json
    - lib/localization/te.json
    - lib/localization/kn.json
    - assets/images/logo.png
